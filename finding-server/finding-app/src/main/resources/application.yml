server:
  port: 8080

spring:
  profiles:
    # 本地开发用 dev，生产部署用 prod；local 为 gitignored 的本地密钥覆盖
    # 可通过命令行 --spring.profiles.active=prod 或环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# 所有日志行携带 traceId(RequestLogInterceptor 写入 MDC;无请求上下文时显示 -)
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.finding.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT
jwt:
  access-secret: finding-access-secret-key-must-be-at-least-256-bits-long-for-hs256
  refresh-secret: finding-refresh-secret-key-must-be-at-least-256-bits-long-too
  access-expiration: 7200000    # 2 hours
  refresh-expiration: 604800000  # 7 days

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# MinIO 对象存储（默认值，dev/prod 环境覆盖）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:Finding@2026}
  bucket: ${MINIO_BUCKET:finding}

# 文件上传限制
finding:
  upload:
    max-size: 5242880   # 5MB
    allowed-types: image/jpeg,image/png,image/webp
  # 相亲匹配评分权重(可调,默认值见 MatchScoreWeights)
  recommend:
    same-school: 15
    same-city: 3
    verified: 5
    recent-active: 3
    has-avatar: 2
    interest-per-keyword: 2
    distance-close: 4
    completeness: 1
    # 反馈闭环:根据用户申请/跳过历史调整
    liked-school: 8
    liked-city: 2
    skipped-school: 8
    skipped-city: 2
    cold-start-verified: 4
    cold-start-active: 3
  # 图片内容安全(鉴黄 + OCR 违禁词)。密钥放环境变量或 gitignored 的 application-local.yml
  image-safety:
    enabled: ${IMAGE_SAFETY_ENABLED:false}
    access-key-id: ${IMAGE_SAFETY_ACCESS_KEY_ID:}
    access-key-secret: ${IMAGE_SAFETY_ACCESS_KEY_SECRET:}
    # 鉴黄要求图片有公网可访问的 URL;生产填后端公网域名(如 https://api.xxx.com),本地留空则跳过鉴黄
    public-base-url: ${IMAGE_SAFETY_PUBLIC_BASE_URL:}
    moderation-region: ${IMAGE_SAFETY_MODERATION_REGION:cn-shanghai}
    ocr-region: ${IMAGE_SAFETY_OCR_REGION:cn-hangzhou}
