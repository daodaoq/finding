spring:
  datasource:
    url: jdbc:mysql://localhost:3306/finding?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:Finding@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:Finding@2026}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:Finding@2026}
    publisher-confirm-type: correlated   # 开启发布确认,Outbox 据此标记已发布
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 3000ms
          max-attempts: 3

# JWT —— 开发环境默认密钥(仅 dev 生效;生产 prod 不加载本文件,密钥必须走环境变量)
jwt:
  access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-key-at-least-256-bits-0000000000}
  refresh-secret: ${JWT_REFRESH_SECRET:dev-only-refresh-secret-key-at-least-256-bits-000000000}

# MinIO 对象存储
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:Finding@2026}
  bucket: ${MINIO_BUCKET:finding}

# WebSocket 允许来源(逗号分隔的 origin 模式;前端与后端同源或走 Vite 代理时命中 localhost)
finding:
  websocket:
    allowed-origin-patterns: http://localhost:*,https://localhost:*,http://127.0.0.1:*

logging:
  level:
    com.finding: debug
    org.springframework.security: debug
